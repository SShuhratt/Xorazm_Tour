services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: xorazmtour-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xorazm-tour

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: xorazmtour-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xorazm-tour

  db:
    image: postgres:15-alpine
    container_name: xorazmtour-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-xorazm_tour_db}
      POSTGRES_USER: ${DB_USERNAME:-xt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-xt_user} -d ${DB_DATABASE:-xorazm_tour_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - xorazm-tour:/var/lib/postgresql/data
    networks:
      - xorazm-tour

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: xorazmtour-nginx
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - storage_data:/var/www/storage/app/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount TLS certificates here in production (e.g. Let's Encrypt):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - xorazm-tour

volumes:
  xorazm-tour:
  storage_data:

networks:
  xorazm-tour:
